<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ff2d2d">

<title>Promo Checkker</title>

<link rel="stylesheet" href="style.css">

<script>
function showToast(){
  const toast = document.getElementById("toast")

  toast.classList.add("show")

  // auto hide 5 detik
  setTimeout(() => {
    toast.classList.remove("show")
  }, 5000)
}

// tampil saat load
window.addEventListener("load", () => {
  showToast()
})
</script>

<style>

/* =========================
FLASH EFFECT
========================= */
.flash {
  position: fixed;
  inset: 0;
  background: white;
  opacity: 0;
  z-index: 1003;
  pointer-events: none;
}

.flash.active {
  animation: flashAnim 0.3s ease;
}

@keyframes flashAnim {
  0% { opacity: 0; }
  50% { opacity: 0.8; }
  100% { opacity: 0; }
}

/* =========================
CAMERA + OVERLAY
========================= */
.camera {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: none;
}

.camera.active {
  display: block;
}

/* overlay khusus */
#overlay {
  z-index: 10000;
  pointer-events: none;
}

/* video di bawah overlay */
#camera {
  z-index: 9999;
}

/* backdrop */
body.camera-open::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 998;
}

#overlay.active {
  display: block;
}

/* =========================
SCAN BAR
========================= */
#scanBar {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(0);

  display: flex;
  align-items: center;
  justify-content: space-between;

  width: 160px;
  height: 60px;

  background: #ff3b30;
  border-radius: 40px;

  box-shadow: 0 8px 20px rgba(0,0,0,0.25);

  z-index: 1001;
  padding: 0 10px;

  backdrop-filter: blur(12px);
}

.scan-icon {
  flex: 1;
  height: 100%;
  border: none;
  background: transparent;

  display: flex;
  align-items: center;
  justify-content: center;
}

.divider {
  width: 1px;
  height: 60%;
  background: rgba(255,255,255,0.5);
}

/* CLOSE BUTTON */
.btn-close {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 20000;
  background: rgba(0,0,0,0.5);
  color: white;
  border: none;
  font-size: 18px;
  padding: 8px 12px;
  border-radius: 8px;
  display: none;
}

.btn-close.active {
  display: block;
}

/* ICON */
.icon-img {
  width: 26px;
  height: 26px;
  object-fit: contain;
  pointer-events: none;
  filter: brightness(0) invert(1);
}

/* =========================
AUTO HIDE ANIMATION
========================= */

#scanBar {
  transition: transform 0.3s ease, opacity 0.3s ease;
}

/* kondisi hidden */
#scanBar.hide {
  transform: translateX(-50%) translateY(120px);
  opacity: 0;
  pointer-events: none;
}

#scanText {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%);

  color: white;
  font-size: 12px;
  font-weight: 500;
  text-align: center;

  z-index: 20001; /* 🔥 penting */
  pointer-events: none;

  text-shadow: 0 2px 6px rgba(0,0,0,0.6);
  opacity: 0;

  transition: opacity 0.3s ease;
}

#scanText.active {
  opacity: 1;
}

#scanText {
  backdrop-filter: blur(4px);
  padding: 6px 12px;
  border-radius: 10px;
}

/* =========================
TOAST MODERN
========================= */
.toast {
  position: fixed;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);

  width: 90%;
  max-width: 340px;

  background: rgba(30,30,30,0.95);
  color: white;

  border-radius: 16px;
  padding: 15px;

  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  backdrop-filter: blur(12px);

  opacity: 0;
  pointer-events: none;
  z-index: 20000;

  transition: all 0.4s ease;
}

.toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}

.toast a {
  display: inline-block;
  margin-top: 8px;
  color: #25D366;
  font-weight: bold;
  text-decoration: none;
}
</style>

</head>

<body>

<header class="header" id="header">

  <div class="header-top">
    <div class="logo">
     <h1 class="logo">Capee<span>X</span></h1>
<p class="subtext">Cek Promo • Scan SKU • Online</p>
    </div>
  </div>

  <div class="header-search">
    <div class="search-box">
      <input id="search" placeholder="Cari SKU, artikel, deskripsi, brand">
      <button class="search-btn">🔍</button>
    </div>
  </div>

</header>

<main>
  <div id="status">Loading...</div>
  <div id="result"></div>
</main>

<!-- SCAN BAR -->
<div id="scanBar">

  <button id="btnCamera" class="scan-icon">
    <img src="assets/camera.png" class="icon-img">
  </button>

  <div class="divider"></div>

  <button id="btnVoice" class="scan-icon">
    <img src="assets/mic.png" class="icon-img">
  </button>

</div>

<!-- FLASH -->
<div id="flash" class="flash"></div>

<!-- CLOSE BUTTON -->
<button id="btnClose" class="btn-close">✕</button>

<!-- CAMERA -->
<video id="camera" autoplay playsinline class="camera"></video>

<!-- OVERLAY (WAJIB untuk drag scan) -->
<canvas id="overlay" class="camera"></canvas>

<div id="scanText">Usap layar arahkan ke SKU</div>

<!-- CANVAS OCR -->
<canvas id="canvas" style="display:none"></canvas>

<!-- LIB OCR -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

<!-- APP -->
<script src="app.js"></script>

<div id="toast" class="toast">
  <div class="toast-content">
    <p>
      Promo Beli 3 Diskon 10% sudah berakhir sejak tanggal 9 April 2026.<br><br>
      Jika masih muncul, promo mengikuti <b>SHARP PRICE</b>.<br><br>

      Kendala teknis atau request fitur bisa<br>
      <a href="https://wa.me/6285713382219" target="_blank">Hubungi Admin</a>
    </p>
  </div>
</div>
</body>
</html>
